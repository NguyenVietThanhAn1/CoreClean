project_id: "YOUR_CROWDIN_PROJECT_ID"
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  - source: /app/src/main/res/values-en/strings.xml
    translation: /app/src/main/res/values-%android_code%/strings.xml
    dest: strings.xml
    type: android

    # Languages already maintained manually — Crowdin should not overwrite them
    excluded_target_languages:
      - vi   # values/ (Vietnamese, maintained in-repo)
      - en   # values-en/ (English source, this IS the source)
