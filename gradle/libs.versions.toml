[versions]
kotlin            = "2.1.10"
agp               = "8.8.2"
compose-bom       = "2025.02.00"
hilt              = "2.55"
hilt-androidx     = "1.2.0"
room              = "2.6.1"
coroutines        = "1.10.1"
lifecycle         = "2.8.7"
work              = "2.10.0"
navigation        = "2.8.8"
coil              = "3.1.0"
ksp               = "2.1.10-1.0.30"
serialization     = "1.8.0"
turbine           = "1.2.0"
robolectric       = "4.13"
appcompat         = "1.7.0"
sentry            = "7.18.0"

[libraries]
compose-bom                 = { group = "androidx.compose",               name = "compose-bom",                  version.ref = "compose-bom" }
compose-ui                  = { group = "androidx.compose.ui",            name = "ui" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",            name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3",     name = "material3" }
compose-navigation          = { group = "androidx.navigation",             name = "navigation-compose",           version.ref = "navigation" }

lifecycle-viewmodel-compose = { group = "androidx.lifecycle",             name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",             name = "lifecycle-runtime-compose",    version.ref = "lifecycle" }

hilt-android                = { group = "com.google.dagger",              name = "hilt-android",                 version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",              name = "hilt-compiler",                version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",                  name = "hilt-navigation-compose",      version.ref = "hilt-androidx" }
hilt-work                   = { group = "androidx.hilt",                  name = "hilt-work",                    version.ref = "hilt-androidx" }
hilt-androidx-compiler      = { group = "androidx.hilt",                  name = "hilt-compiler",                version.ref = "hilt-androidx" }

room-runtime                = { group = "androidx.room",                  name = "room-runtime",                 version.ref = "room" }
room-ktx                    = { group = "androidx.room",                  name = "room-ktx",                     version.ref = "room" }
room-compiler               = { group = "androidx.room",                  name = "room-compiler",                version.ref = "room" }
room-testing                = { group = "androidx.room",                  name = "room-testing",                 version.ref = "room" }

coroutines-android          = { group = "org.jetbrains.kotlinx",          name = "kotlinx-coroutines-android",   version.ref = "coroutines" }
coroutines-test             = { group = "org.jetbrains.kotlinx",          name = "kotlinx-coroutines-test",      version.ref = "coroutines" }

work-runtime                = { group = "androidx.work",                  name = "work-runtime-ktx",             version.ref = "work" }
work-testing                = { group = "androidx.work",                  name = "work-testing",                 version.ref = "work" }
robolectric                 = { group = "org.robolectric",                name = "robolectric",                  version.ref = "robolectric" }

coil-compose                = { group = "io.coil-kt.coil3",               name = "coil-compose",                 version.ref = "coil" }
coil-video                  = { group = "io.coil-kt.coil3",               name = "coil-video",                   version.ref = "coil" }

serialization-json          = { group = "org.jetbrains.kotlinx",          name = "kotlinx-serialization-json",   version.ref = "serialization" }

turbine                     = { group = "app.cash.turbine",               name = "turbine",                      version.ref = "turbine" }
appcompat                   = { group = "androidx.appcompat",              name = "appcompat",                    version.ref = "appcompat" }
sentry-android              = { group = "io.sentry",                       name = "sentry-android",               version.ref = "sentry" }

[plugins]
android-application         = { id = "com.android.application",                                version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",                           version.ref = "kotlin" }
hilt                        = { id = "com.google.dagger.hilt.android",                         version.ref = "hilt" }
ksp                         = { id = "com.google.devtools.ksp",                                version.ref = "ksp" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization",              version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose",                    version.ref = "kotlin" }
android-test                = { id = "com.android.test",                                        version.ref = "agp" }