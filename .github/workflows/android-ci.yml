name: Android CI

on:
  push:
    branches: [main, master, develop, sprint-2]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build FOSS debug APK (catch compile errors early)
        run: ./gradlew :app:assembleFossDebug

      - name: Build GMS debug APK
        run: ./gradlew :app:assembleGmsDebug

      - name: Run unit tests (GMS)
        run: ./gradlew :app:testGmsDebugUnitTest

      - name: Run unit tests (FOSS)
        run: ./gradlew :app:testFossDebugUnitTest

      - name: Run lint (GMS)
        run: ./gradlew :app:lintGmsDebug

      - name: Generate JaCoCo coverage report
        run: ./gradlew :app:jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          fail_ci_if_error: false

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-java${{ matrix.java-version }}
          path: app/build/reports/

  release-check:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble GMS release (unsigned)
        run: ./gradlew :app:assembleGmsRelease
        env:
          KEYSTORE_PATH: ""

      - name: Assemble FOSS release (unsigned)
        run: ./gradlew :app:assembleFossRelease
        env:
          KEYSTORE_PATH: ""

      - name: Upload Sentry source maps (GMS only)
        if: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        run: ./gradlew :app:sentryUploadProguardMappingsGmsRelease
        continue-on-error: true

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-apks
          path: app/build/outputs/apk/
