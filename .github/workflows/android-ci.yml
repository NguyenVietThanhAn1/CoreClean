name: Android CI

on:
  push:
    branches: [main, master, develop, sprint-2]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build FOSS debug APK (catch compile errors early)
        run: ./gradlew :app:assembleFossDebug

      - name: Build GMS debug APK
        run: ./gradlew :app:assembleGmsDebug

      - name: Run unit tests (GMS)
        run: ./gradlew :app:testGmsDebugUnitTest

      - name: Run unit tests (FOSS)
        run: ./gradlew :app:testFossDebugUnitTest

      - name: Run lint (GMS)
        run: ./gradlew :app:lintGmsDebug

      - name: Generate JaCoCo coverage report
        run: ./gradlew :app:jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          fail_ci_if_error: false

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-java${{ matrix.java-version }}
          path: app/build/reports/

  release-check:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Signed builds require these GitHub repository secrets:
      #   KEYSTORE_BASE64  — base64-encoded .jks file
      #   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # When secrets are absent the step runs unsigned (CI smoke-test only).
      - name: Decode keystore (if secret present)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Bundle GMS release (AAB)
        run: ./gradlew :app:bundleGmsRelease
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && '/tmp/release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Assemble FOSS release APK
        run: ./gradlew :app:assembleFossRelease
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && '/tmp/release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify FOSS APK contains no Sentry classes
        run: |
          APK=$(find app/build/outputs/apk/foss/release -name '*.apk' | head -1)
          if unzip -l "$APK" | grep -q 'io/sentry'; then
            echo "ERROR: io.sentry classes found in FOSS APK!" && exit 1
          fi
          echo "OK: no io.sentry in FOSS APK"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/foss/release/*.apk
            app/build/outputs/bundle/gmsRelease/*.aab
